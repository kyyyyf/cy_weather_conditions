# Docker deployment config.
# database_path and log_file point to the shared named volume mounted at /data.
database_path = "/data/weather_conditions.db"
log_file      = "/data/collector.log"

[weather_stations]
codes = [
    "LEFKOSIA",
    "ATHALASSA",
    "LCLK",
    "PAPHOS",
    "LIMASSOL",
    "CAVO_GRECO",
]

[air_quality_stations]
names = [
    "Nicosia - Traffic Station",
    "Larnaca - Traffic Station",
    "Paphos - Traffic Station",
    "Limassol - Traffic Station",
    "Paralimni - Traffic Station",
]
